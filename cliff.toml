# git-cliff configuration (DEVOPS-TASKS week 9).
# `pnpm run changelog` rewrites CHANGELOG.md from the Conventional Commits history;
# the Release workflow renders the section for the tag into the release body.
# Edit CHANGELOG.md by hand before publishing a draft: the generator gives the
# skeleton, the release notes say what it means for a user.

[changelog]
header = """
# Changelog

All notable changes to Orbit. Generated from Conventional Commits with git-cliff,
then edited by hand before each release.

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
  {{ commit.message | split(pat="\n") | first | trim }}\
  {% if commit.breaking %} **(breaking)**{% endif %}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  # Drop the "Co-Authored-By" trailer and anything after the subject line.
  { pattern = "\\n[\\s\\S]*", replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^style", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore: release", skip = true },
  { message = "^chore", group = "<!-- 5 -->Maintenance" },
  { message = "^build", group = "<!-- 5 -->Maintenance" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
