[package]
name = "orbit"
version = "0.1.0-alpha.2"
description = "Orbit — an offline-first personal operating system"
authors = ["Orbit"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: the resident tray (week 11).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
# Resident desktop (week 11): one process, opt-in login launch.
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# Diagnostics bundles (week 10): deflate only, no encryption or exotic codecs.
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Notification activation (week 12): toasts with a protocol launch payload and an
# immediate submission result, which the notification plugin cannot provide.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation"] }

# Keep useful source locations in development backtraces without making MSVC
# generate the much larger full debug database on every app relink.
[profile.dev]
debug = "line-tables-only"

# Small, fast release binaries (DEVOPS-TASKS week 7).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
