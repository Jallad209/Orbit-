[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "Unmaintained rust-unic crate pulled by Tauri 2.11.5 through urlpattern; no safe compatible replacement is available." },
  { id = "RUSTSEC-2025-0080", reason = "Unmaintained rust-unic crate pulled by Tauri 2.11.5 through urlpattern; no safe compatible replacement is available." },
  { id = "RUSTSEC-2025-0081", reason = "Unmaintained rust-unic crate pulled by Tauri 2.11.5 through urlpattern; no safe compatible replacement is available." },
  { id = "RUSTSEC-2025-0098", reason = "Unmaintained rust-unic crate pulled by Tauri 2.11.5 through urlpattern; no safe compatible replacement is available." },
  { id = "RUSTSEC-2025-0100", reason = "Unmaintained rust-unic crate pulled by Tauri 2.11.5 through urlpattern; no safe compatible replacement is available." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Orbit has no network feature. These crates must not enter the Windows graph,
# even transitively. The lockfile may contain target-specific copies used on
# other operating systems; the graph above deliberately evaluates Windows.
deny = [
  { name = "curl" },
  { name = "hyper" },
  { name = "hyper-util" },
  { name = "native-tls" },
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "reqwest" },
  { name = "ring" },
  { name = "rustls" },
  { name = "ureq" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
