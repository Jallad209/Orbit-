name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency and offline-boundary audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Capture JavaScript audit and licence reports
        shell: bash
        run: |
          mkdir -p audit-reports
          pnpm audit --json > audit-reports/pnpm-audit.json || true
          pnpm licenses list --prod --json > audit-reports/pnpm-licenses.json

      - name: Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust audit tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Audit Rust advisories
        run: cargo audit --file apps/orbit/src-tauri/Cargo.lock

      - name: Enforce licences, sources, and the no-network dependency boundary
        run: cargo deny --manifest-path apps/orbit/src-tauri/Cargo.toml check

      - name: Capture Rust audit report
        if: always()
        shell: bash
        run: cargo audit --json --file apps/orbit/src-tauri/Cargo.lock > audit-reports/cargo-audit.json || true

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: audit-reports/
          retention-days: 14

  checks:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Type-check
        run: pnpm run type-check

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build web
        run: pnpm --filter orbit run build

      - name: Bundle size
        run: |
          echo "### Web bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh apps/orbit/dist >> "$GITHUB_STEP_SUMMARY"
          ls -la apps/orbit/dist/assets | awk '{print $5, $9}' | sort -rn | head -10 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust shell (fmt, clippy, check)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/orbit/src-tauri

      # tauri-build reads tauri.conf.json and needs the frontendDist folder to exist.
      - name: Placeholder frontend
        shell: pwsh
        run: New-Item -ItemType Directory -Force apps/orbit/dist | Out-Null

      - name: Format
        run: cargo fmt --manifest-path apps/orbit/src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path apps/orbit/src-tauri/Cargo.toml -- -D warnings

      - name: Check
        run: cargo check --manifest-path apps/orbit/src-tauri/Cargo.toml

      - name: Test
        run: cargo test --manifest-path apps/orbit/src-tauri/Cargo.toml
