name: Data safety

# User data must never be lost silently. Four checks, every PR and every night:
#   1. a 50,000-task export → import → export round trip is byte-identical
#   2. every stored IndexedDB and SQLite schema version upgrades to today's
#      without losing rows, and a SQLite backup restores identically
#   3. in a real browser, records survive a reload and a denied-persistence
#      browser still offers a working export
#   4. the real desktop build runs the core loop over SQLite on Windows

on:
  pull_request:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: data-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  round-trip:
    name: Round trip and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Export / import round trip (50k tasks)
        run: pnpm run test:roundtrip
        env:
          ROUNDTRIP_SIZE: '50000'

      - name: Schema migration matrix (IndexedDB and SQLite fixtures)
        run: pnpm run test:migrations

      - name: SQLite backup → restore → compare
        run: pnpm run verify:backup

      - name: Fixtures are current
        # A schema bump without regenerated fixtures fails here.
        run: |
          pnpm run make:fixture
          git diff --exit-code --stat -- tests/fixtures || {
            echo "::error::Fixtures are stale. Run 'pnpm run make:fixture' and commit the result."
            exit 1
          }

  browser:
    name: Persistence in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm --filter orbit run build

      # Chromium only: this job installs one browser; the three-browser run of the same spec
      # is the E2E workflow.
      - name: Persistence and quota checks
        run: pnpm exec playwright test tests/e2e/playwright/data-safety.spec.ts --project=chromium
        env:
          CI: true

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-safety-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop:
    name: Core loop on the desktop build (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/orbit/src-tauri
          cache-targets: true

      - name: tauri-driver cache
        id: tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-2.0.6-${{ runner.os }}

      - name: Install tauri-driver
        if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.0.6 --locked

      # The Evergreen WebView2 runtime ships on the runner image; the driver has to match it.
      - name: Edge WebDriver matching the WebView2 runtime
        shell: pwsh
        run: pnpm run edge:driver

      - name: Build the app (binary only; installers are the release workflow's job)
        run: pnpm run tauri:build:bin

      # GitHub-hosted Windows runners are elevated, and WebView2 ignores the remote-debugging
      # override for an elevated host: Edge WebDriver never sees DevToolsActivePort and the cold
      # harness never gets a CDP port (every run of this job failed that way until 19 September).
      # Both harnesses therefore run under a restricted, non-admin token.
      - name: Core loop on desktop
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/run-unelevated.ps1 -CommandLine "pnpm run e2e:desktop"
        env:
          CI: true

      # Direct-process tests use the exact release binary: cold activation, 50k startup,
      # scheduled backup, CSP, and the WebView network boundary.
      - name: Cold desktop safety and performance
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/run-unelevated.ps1 -CommandLine "pnpm run e2e:desktop:cold"
        env:
          CI: true
