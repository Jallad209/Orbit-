name: Data safety

# User data must never be lost silently. Three checks, every PR and every night:
#   1. a 50,000-task export → import → export round trip is byte-identical
#   2. every stored IndexedDB schema version upgrades to today's without losing rows
#   3. in a real browser, records survive a reload and a denied-persistence
#      browser still offers a working export

on:
  pull_request:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: data-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  round-trip:
    name: Round trip and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Export / import round trip (50k tasks)
        run: pnpm run test:roundtrip
        env:
          ROUNDTRIP_SIZE: '50000'

      - name: Schema migration matrix
        run: pnpm run test:migrations

      - name: Fixtures are current
        # A schema bump without regenerated fixtures fails here.
        run: |
          pnpm run make:fixture
          git diff --exit-code --stat -- tests/fixtures || {
            echo "::error::Fixtures are stale. Run 'pnpm run make:fixture' and commit the result."
            exit 1
          }

  browser:
    name: Persistence in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm --filter orbit run build

      - name: Persistence and quota checks
        run: pnpm exec playwright test tests/e2e/playwright/data-safety.spec.ts
        env:
          CI: true

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-safety-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
